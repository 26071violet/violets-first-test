<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        简易ATM机
    </h1>

    <script>
        var yue = parseFloat(0);
        while (true) {
            var atm = prompt(`请问您需要办理什么业务\n1、存钱\n2、取钱\n3、显示余额\n4、退出`);
            switch (atm) {
                case '1':
                    var save = prompt('请输入存钱金额：');
                    yue += parseFloat(save);
                    alert(`已存入${save}元。`);
                    break;
                case '2':
                    var withdrew = prompt('请输入取钱金额：');
                    if (withdrew > yue) {
                        alert(`余额不足`);
                    } else {
                        yue = yue - parseFloat(withdrew);
                        alert(`已取出${withdrew}元。`);
                    }
                    break;
                case '3':
                    alert(`余额还剩${yue}元。`);
                    break;
                case '4':
                    alert(`已安全退出，祝您生活愉快！`);
                    break;
            }
        }
    </script>
</body>

</html>
